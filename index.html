<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f2">
  <meta name="description" content="Tu colección visual de comidas y recetas.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Comiditas</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Comiditas</h1>
      <button class="icon-button primary" id="quickAdd" aria-label="Agregar">＋</button>
    </header>

    <div class="spaces" role="group" aria-label="Colección">
      <button class="space active" data-space="mine">Mis comidas</button>
      <button class="space pink" data-space="milla">Millá ♡</button>
    </div>

    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Buscar comida o ingrediente…" autocomplete="off">
      <button id="clearSearch" class="clear-search" aria-label="Borrar búsqueda" hidden>×</button>
    </label>

    <nav class="tabs" aria-label="Secciones">
      <button class="tab active" data-view="meals">Comiditas</button>
      <button class="tab" data-view="recipes">Recetas</button>
    </nav>

    <section id="mealView">
      <div class="filters" id="filters">
        <button class="filter active" data-category="Todas">Todas</button>
        <button class="filter" data-category="Desayuno / Merienda">Desayuno / Merienda</button>
        <button class="filter" data-category="Almuerzo / Cena">Almuerzo / Cena</button>
        <button class="filter" data-category="Snacks / Postres">Snacks / Postres</button>
      </div>
      <div id="mealGrid" class="grid"></div>
      <p id="emptyMeals" class="empty" hidden>No hay comidas acá todavía.</p>
    </section>

    <section id="recipeView" hidden>
      <div id="recipeList" class="recipe-list"></div>
      <p id="emptyRecipes" class="empty" hidden>No hay recetas todavía.</p>
    </section>

    <footer class="bottom-actions">
      <button id="addMealFooter" class="add-button">＋ Agregar comida</button>
      <button id="addRecipeFooter" class="secondary-button">＋ Receta</button>
    </footer>
  </main>

  <dialog id="mealDialog" class="modal">
    <form id="mealForm" method="dialog">
      <div class="modal-head"><h2 id="mealDialogTitle">Agregar comida</h2><button type="button" class="icon-button" data-close="mealDialog" aria-label="Cerrar">×</button></div>
      <input type="hidden" id="mealId">
      <div class="photo-actions">
        <label class="photo-button">▧ Elegir fotos<input id="galleryInput" type="file" accept="image/*" multiple></label>
        <label class="photo-button">◎ Sacar foto<input id="cameraInput" type="file" accept="image/*" capture="environment"></label>
      </div>
      <p class="hint">Podés elegir varias fotos; se crea una comida por foto. Si no elegís foto, también podés guardar solo el título.</p>
      <div id="photoPreview" class="photo-preview"></div>
      <label class="field">Nombre<input id="mealName" required maxlength="120" placeholder="Ej. Tarta de pollo"></label>
      <label class="field">Ingredientes para buscar (opcional)<textarea id="mealIngredients" rows="2" placeholder="Pollo, cebolla, huevo…"></textarea></label>
      <label class="field">Categoría
        <select id="mealCategory">
          <option>Desayuno / Merienda</option>
          <option selected>Almuerzo / Cena</option>
          <option>Snacks / Postres</option>
        </select>
      </label>
      <label class="check-row"><input id="mealForMilla" type="checkbox"><span>También para Millá ♡</span></label>
      <div class="modal-actions"><button type="button" class="secondary-button" data-close="mealDialog">Cancelar</button><button class="add-button" type="submit">Guardar</button></div>
    </form>
  </dialog>

  <dialog id="recipeDialog" class="modal">
    <form id="recipeForm" method="dialog">
      <div class="modal-head"><h2 id="recipeDialogTitle">Agregar receta</h2><button type="button" class="icon-button" data-close="recipeDialog" aria-label="Cerrar">×</button></div>
      <input type="hidden" id="recipeId">
      <label class="field">Nombre<input id="recipeName" required maxlength="120" placeholder="Ej. Masa de tarta"></label>
      <label class="field">Ingredientes<textarea id="recipeIngredients" rows="4" placeholder="Escribí los ingredientes…"></textarea></label>
      <label class="field">Preparación<textarea id="recipeSteps" rows="5" placeholder="Paso a paso…"></textarea></label>
      <div class="modal-actions"><button type="button" class="secondary-button" data-close="recipeDialog">Cancelar</button><button class="add-button" type="submit">Guardar</button></div>
    </form>
  </dialog>

  <dialog id="detailDialog" class="modal detail-modal">
    <div class="modal-head"><h2 id="detailTitle"></h2><button type="button" class="icon-button" data-close="detailDialog" aria-label="Cerrar">×</button></div>
    <div id="detailContent"></div>
    <div class="modal-actions"><button id="editDetail" class="secondary-button">Editar</button><button id="deleteDetail" class="danger-button">Eliminar</button></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
